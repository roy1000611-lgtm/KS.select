<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>球鞋收藏展示間</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <p class="kicker">收藏鞋款・限量流通</p>
      <h1>球鞋展示間</h1>
      <p class="sub">現貨為主，一雙售出即下架。有興趣請私訊 IG 洽詢尺寸與鞋況。</p>
    </div>
  </header>

  <main>
    <div id="product-grid" class="product-grid">
      <!-- 商品卡片會由 script.js 自動產生 -->
    </div>
    <p id="empty-state" class="empty-state" hidden>目前鞋櫃是空的，新貨到馬上補上，先追蹤 IG 別錯過。</p>
  </main>

  <footer class="site-footer">
    <p>價格與現貨以私訊回覆為準・照片皆為實物拍攝</p>
  </footer>

  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox-close" aria-label="關閉">✕</button>
    <button class="lightbox-nav lightbox-prev" aria-label="上一張">‹</button>
    <img class="lightbox-img" id="lightbox-img" src="" alt="">
    <button class="lightbox-nav lightbox-next" aria-label="下一張">›</button>
    <p class="lightbox-count" id="lightbox-count"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
